name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fixdev-io/fixdev-io:latest
            ghcr.io/fixdev-io/fixdev-io:sha-${{ github.sha }}

      # Выкатку делает инфра-репо: прод — Docker Swarm, стек `push_helper`, сервис
      # `push_helper_fixdev-blog` описан в push-helper-infra/docker-compose.push-helper.yml
      # и раскатывается его playbooks/deploy.yml (docker stack deploy --with-registry-auth).
      # Отсюда только сигнал — как в freelance-bot и push-helper. Требует секрет
      # DEPLOY_TOKEN: PAT с правом repo на fixdev-io/push-helper-infra.
      - name: Trigger production deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: fixdev-io/push-helper-infra
          event-type: deploy
          client-payload: '{"environment": "production"}'
